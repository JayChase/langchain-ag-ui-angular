name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build schemas
        run: pnpm --filter schemas run build

      - name: Build app
        run: pnpm --filter app run build

      - name: Build api
        run: pnpm --filter api run build

      - name: Test app
        run: pnpm --filter app run test:coverage

      - name: Test api
        run: pnpm --filter api run test:coverage

      - name: Test agent
        run: pnpm --filter agent run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/app/coverage
            packages/api/coverage
            packages/agent/coverage
          if-no-files-found: warn

