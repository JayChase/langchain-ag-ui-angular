# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: langchain-ag-ui-angular
metadata:
    template: azd-init@1.31.1

workflows:
  up:
    - azd: provision
    - azd: package --all
    - azd: deploy --all

hooks:
  preup:
    posix:
      shell: sh
      run: node ./infra/minimal-provision.mjs preup
    windows:
      shell: pwsh
      run: node ./infra/minimal-provision.mjs preup
  prepackage:
    posix:
      shell: sh
      run: node ./infra/minimal-provision.mjs prepackage
    windows:
      shell: pwsh
      run: node ./infra/minimal-provision.mjs prepackage
  predeploy:
    posix:
      shell: sh
      run: node ./infra/minimal-provision.mjs predeploy
    windows:
      shell: pwsh
      run: node ./infra/minimal-provision.mjs predeploy
  prepublish:
    posix:
      shell: sh
      run: node ./infra/minimal-provision.mjs prepublish
    windows:
      shell: pwsh
      run: node ./infra/minimal-provision.mjs prepublish
  preprovision:
    posix:
      shell: sh
      run: node ./infra/minimal-provision.mjs preprovision

    windows:
      shell: pwsh
      run: node ./infra/minimal-provision.mjs preprovision
  postprovision:
    posix:
      shell: sh
      run: node ./infra/minimal-provision.mjs postprovision

    windows:
      shell: pwsh
      run: node ./infra/minimal-provision.mjs postprovision
 
  postdeploy:
    posix:
      shell: sh
      interactive: true
      run: node ./infra/minimal-provision.mjs postdeploy

    windows:
      shell: pwsh
      interactive: true
      run: node ./infra/minimal-provision.mjs postdeploy

services:
  app:
    project: .
    host: containerapp
    language: js
    docker:
      path: packages/app/Dockerfile
      context: .
      remoteBuild: true
  api:
    project: .
    host: containerapp
    language: js
    docker:
      path: packages/api/Dockerfile
      context: .
      remoteBuild: true
  agent:
    project: .
    host: containerapp
    language: js
    docker:
      path: packages/agent/Dockerfile
      context: .
      remoteBuild: true